name: devdrive-resize-test
parent: dbosoft/{{OS_VERSION}}/starter

# C: must be large enough to give up 50 GB; egs extends it to the disk size
drives:
  - name: sda
    size: 127

fodder:
  - source: gene:{{GENE}}:configure
    variables:
      - name: devdrive_location
        value: C
      - name: devdrive_type
        value: resize
      - name: devdrive_size
        value: "50"
