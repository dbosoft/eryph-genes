# Checks for pull requests and pushes to main: builds and packs every geneset
# (no push to the genepool) and runs the static repository checks.
# Base catlet builds run separately, see azure-pipelines-base-catlets.yml.

trigger:
  branches:
    include:
    - main

pr:
  branches:
    include:
    - main

pool:
  vmImage: windows-latest

steps:
- checkout: self

- task: NodeTool@0
  displayName: Install Node.js
  inputs:
    versionSpec: '22.x'

- pwsh: ./prepare.ps1
  displayName: Install build tools

- pwsh: pnpm install --frozen-lockfile
  displayName: Install dependencies

- pwsh: pnpm turbo build
  displayName: Build and pack all genesets

- pwsh: ./Test-Repository.ps1
  displayName: Repository checks

# Local refs differ from the genepool between a commit and the following
# push, so a mismatch is reported but doesn't fail the build.
- pwsh: ./check_ref_consistency.ps1
  displayName: Compare tag references with the genepool
  continueOnError: true
